<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linh & Huy · Affiche photos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="styles.css">
<!-- Printable A4 poster pointing to ?page=photos. Print: Ctrl+P, no margins. -->
<style>
@page{size:A4;margin:0}
body{margin:0;background:var(--paper)}
.poster{box-sizing:border-box;width:210mm;height:297mm;margin:0 auto;display:grid;align-content:center;justify-items:center;gap:7mm;padding:20mm;text-align:center;background:var(--paper)}
.script{font:30mm/1 var(--font-script);color:var(--accent-primary);white-space:nowrap}
.label{font:600 4.5mm var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--accent-primary)}
.title{font:15mm/1.1 var(--font-display);color:var(--text-strong)}
.sub{font:italic 6mm/1.4 var(--font-serif);color:var(--text-muted)}
.qr{width:110mm;height:110mm;background:#fff;border-radius:5mm;padding:4mm}
@media print{.poster{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="poster">
  <div class="script">Linh &amp; Huy</div>
  <div class="label">Partagez vos photos</div>
  <div class="title">Scannez-moi pour<br>uploader vos photos&nbsp;!</div>
  <img class="qr" src="photos-qr.png" alt="QR code">
  <div class="sub">Quét mã để gửi ảnh của bạn · Scan to share your photos</div>
</div>
</body></html>
