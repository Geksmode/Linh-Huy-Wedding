<script type="text/babel" src="story.js"></script>
<script type="text/babel" src="schedule.js"></script>
<script type="text/babel" src="rsvp.js"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState(localStorage.getItem('lh-page')||'home');
  const [lang,setLangS]=React.useState(()=>{const q=new URLSearchParams(location.search).get('lang');const l=window.STRINGS[q]?q:localStorage.getItem('lh-lang');return window.STRINGS[l]?l:'vi';});
  const go=p=>{setPage(p);localStorage.setItem('lh-page',p);window.scrollTo(0,0)};
  const setLang=l=>{setLangS(l);localStorage.setItem('lh-lang',l)};
  const [theme,setThemeS]=React.useState('colorful');
  const setTheme=v=>{setThemeS(v);localStorage.setItem('lh-theme2',v)};
  React.useEffect(()=>{document.documentElement.dataset.theme=theme},[theme]);
  React.useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dataset.lang=lang},[lang]);
  const t=window.STRINGS[lang];
  const P={home:Home,story:Story,schedule:Schedule,rsvp:Rsvp}[page]||Home;
  return <><Nav page={page} go={go} t={t} lang={lang} setLang={setLang}/><P go={go} t={t} theme={theme} lang={lang}/><Footer t={t} theme={theme}/><StyleSwitch theme={theme} setTheme={setTheme}/></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
